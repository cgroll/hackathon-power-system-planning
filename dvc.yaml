stages:
  # This repo's only network-dependent stage: fetches data/input/ from a
  # shared archive (energy-data-hub's output, zipped -- see
  # book/markdown/data_sources.md). persist: true means an existing
  # download is left alone on every `dvc repro`; delete the output dirs
  # (or `dvc repro -f download_input_data`) to force a fresh fetch.
  download_input_data:
    cmd: uv run python pipeline/download_input_data.py
    deps:
      - pipeline/download_input_data.py
    outs:
      - data/input/pecd/:
          persist: true
      - data/input/mastr/:
          persist: true
      - data/input/regions/:
          persist: true

  # Example analysis stage, over Track B's ready-to-use national PECD
  # series -- shows the jupytext-script-to-notebook pattern this repo
  # uses (see AGENTS.md). Add your own stages the same way as you build
  # out either track.
  input_data_overview:
    cmd: >-
      MPLBACKEND=Agg uv run jupytext --to notebook --execute
      --set-kernel python3
      --output book/notebooks/00_explore_input_data.ipynb
      pipeline/00_explore_input_data.py &&
      uv run python pipeline/_strip_jupytext_metadata.py
      book/notebooks/00_explore_input_data.ipynb
    deps:
      - pipeline/00_explore_input_data.py
      - data/input/pecd
      - data/input/mastr
      - data/input/regions
    outs:
      - book/notebooks/00_explore_input_data.ipynb:
          cache: false
  explore_capacity_factors_de:
    cmd: >-
      MPLBACKEND=Agg uv run jupytext --to notebook --execute
      --set-kernel python3
      --output book/notebooks/01_explore_capacity_factors_de.ipynb
      pipeline/01_explore_capacity_factors_de.py &&
      uv run python pipeline/_strip_jupytext_metadata.py
      book/notebooks/01_explore_capacity_factors_de.ipynb
    deps:
      - pipeline/01_explore_capacity_factors_de.py
      - data/input/pecd/pecd_country_capacity_factors_simple_de.parquet
    outs:
      - book/notebooks/01_explore_capacity_factors_de.ipynb:
          cache: false
      - output/images/01_monthly_capacity_factors.png:
          cache: false
      - output/images/01_seasonality_by_month.png:
          cache: false
      - output/images/01_sample_weeks.png:
          cache: false
